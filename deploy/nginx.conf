# Research Desk on the former Empire download host.
# ACME challenges stay on /var/www/empire so the existing certificate can renew.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/empire;
        default_type "text/plain";
    }

    location / {
        proxy_pass http://127.0.0.1:3217;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    server_tokens off;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.install-empire.com install-empire.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/empire;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.install-empire.com install-empire.com;

    ssl_certificate     /etc/letsencrypt/live/www.install-empire.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.install-empire.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout 1h;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/empire;
        default_type "text/plain";
    }

    location / {
        proxy_pass http://127.0.0.1:3217;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    server_tokens off;
}
